# RepoPrompt CE SwiftLint policy.
# Full-repo lint uses this config for file discovery. Keep these include/exclude
# lists aligned with Scripts/swift_style.sh's SwiftFormat first-party scope.

included:
  - Package.swift
  - Sources/RepoPrompt
  - Sources/RepoPromptAgentCore
  - Sources/RepoPromptPlatform
  - Sources/RepoPromptUI
  - Sources/RepoPromptWorkspace
  - Sources/RepoPromptExecutable
  - Sources/RepoPromptMCP
  - Packages/RepoPromptCore/Package.swift
  - Packages/RepoPromptCore/Sources
  - Packages/RepoPromptCore/Tests
  - Tests/RepoPromptTests
  - Packages/RepoPromptAgentProviders/Package.swift
  - Packages/RepoPromptAgentProviders/Sources
  - Packages/RepoPromptAgentProviders/Tests

excluded:
  - .build
  - .swiftpm
  - build
  - Carthage
  - DerivedData
  - Generated
  - Pods
  - Vendor
  - Packages/RepoPromptAgentProviders/.build
  - Packages/RepoPromptCore/.build
  - Sources/CSwiftPCRE2
  - Sources/RepoPromptC
  - Sources/RepoPromptPlatform/ThirdParty/SwiftPCRE2
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPromptSharedFragments.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+Build.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+DeepPlan.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+Investigate.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+Optimize.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+OracleExport.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+Orchestrate.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+Refactor.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+Reminder.swift
  - Sources/RepoPromptAgentCore/AI/Prompts/Workflows/WorkflowPrompt+Review.swift

# Keep the initial integration intentionally humane. Broader cleanup-oriented
# rules are deferred until the one-time baseline and future focused cleanup work.
only_rules:
  # Whitespace and punctuation.
  - colon
  - comma
  # Deferred because SwiftFormat's configured before-first wrapping puts braces
  # for multiline clauses on the next line, which conflicts with SwiftLint's
  # opening_brace / statement_position expectations in the current baseline.
  - function_name_whitespace
  - return_arrow_whitespace
  - trailing_newline
  - trailing_semicolon
  - vertical_whitespace

  # Low-noise Swift idioms.
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - redundant_string_enum_value
  - redundant_void_return
  - unneeded_break_in_switch
  - unused_enumerated
  - void_return

  # Imports and diagnostics hygiene.
  - unused_import

  # UI quality gates.
  - custom_rules

# Deferred for later cleanup plans: line/file/type/function length, complexity,
# force unwrap/try/cast, implicitly unwrapped optionals, unowned captures,
# strict naming rules, broad optional-binding/empty-count idiom cleanup,
# discardable-let cleanup, sorted imports, empty enum argument cleanup,
# fatalError message cleanup, prompt-string leading/trailing whitespace, and
# SwiftLint brace/statement-position rules that currently conflict with
# SwiftFormat wrapping.

custom_rules:
  no_swiftui_help_modifier:
    name: "SwiftUI .help Modifier"
    included:
      - 'Sources/RepoPrompt/.*\.swift$'
      - 'Sources/RepoPromptUI/.*\.swift$'
      - 'Sources/RepoPromptWorkspace/.*\.swift$'
    regex: '\.help\s*\('
    match_kinds:
      - identifier
    message: "Use .hoverTooltip(...) instead of .help(...)."
    severity: error
  no_generic_task_sleep_in_mcp_helper:
    name: "Generic Task.sleep in MCP helper"
    included:
      - 'Packages/RepoPromptCore/Sources/RepoPromptMCPCore/.*\.swift$'
    regex: '\.sleep\s*\(\s*(for|until)\s*:'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    message: "Use Task.sleep(nanoseconds:) in the MCP helper: the generic Task.sleep(for:) specialization aborts in swift_task_dealloc (swiftlang/swift#86204, Swift 6.3.x)."
    severity: error
  no_hardcoded_workspaces_store_path:
    name: "Hardcoded Workspaces store path"
    included:
      - 'Sources/.*\.swift$'
      - 'Packages/[^/]+/Sources/.*\.swift$'
    excluded:
      # The one owner of the store location (production, XCTest-isolated, and override roots).
      - 'Sources/RepoPromptWorkspace/Persistence/WorkspaceStorageRoot\.swift$'
    regex: '(appendingPathComponent\s*\(|appending\s*\(\s*(path|component)\s*:)\s*"Workspaces(/[^"\n]*)?"|"[^"\n]*/Workspaces(/[^"\n]*)?"'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
    message: "Resolve the Workspaces store through WorkspaceStorageRoot (or WorkspaceStoragePaths.defaultRoot); a hardcoded join bypasses XCTest isolation and writes into the live store."
    severity: error

reporter: "xcode"
